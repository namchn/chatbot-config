# 숙제 도우미 챗봇의 지금 판 (Blue). 42일차 app.yaml을 이 파일로 덮어씁니다
# 고칠 곳은 image 줄 하나: stu01은 내 아이디 (소문자), sha-1a2b3c4는 지금 Tag
# 롤링을 천천히 보이게 replicas 3, minReadySeconds 20, maxSurge 1로 둡니다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-web
  labels:
    app: chatbot-web
spec:
  replicas: 3
  minReadySeconds: 20
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chatbot-web
  template:
    metadata:
      labels:
        app: chatbot-web
        tier: chat
        version: blue
    spec:
      containers:
      - name: web
        image: ghcr.io/stu01/chatbot-ci:sha-1a2b3c4
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
